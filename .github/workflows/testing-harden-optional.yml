# Opt-in testing-harden v0 tracks. workflow_dispatch only.
# Never runs on pull_request / push — PR CI (iface-pin.yml) is unchanged.
# plane_staging exits 0 when secrets are missing (not a failure).
name: testing harden optional

on:
  workflow_dispatch:
    inputs:
      track:
        description: Opt-in track (plane_staging needs repo secrets)
        type: choice
        options:
          - live_cottage
          - plane_staging
          - both
        default: both

jobs:
  live-cottage:
    name: live_cottage
    if: github.event.inputs.track == 'live_cottage' || github.event.inputs.track == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: pytest live_cottage
        env:
          AIMMUNE_LIVE_COTTAGE: "1"
        run: pytest -q -m live_cottage

  plane-staging:
    name: plane_staging
    if: github.event.inputs.track == 'plane_staging' || github.event.inputs.track == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: pytest plane_staging (skip-ok if secrets missing)
        env:
          PANOPTICON_BASE_URL: ${{ secrets.PANOPTICON_BASE_URL }}
          HM_SITE_TOKEN: ${{ secrets.HM_SITE_TOKEN }}
          SITE_ID: ${{ secrets.SITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${PANOPTICON_BASE_URL:-}" ] || [ -z "${HM_SITE_TOKEN:-}" ] || [ -z "${SITE_ID:-}" ]; then
            echo "plane staging secrets missing — skip (not a failure)"
            exit 0
          fi
          pytest -q -m plane_staging
