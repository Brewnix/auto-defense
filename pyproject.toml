[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aimmune"
version = "0.1.0"
description = "AImmune site executor — detect → block → receipt → fyber.auditor → Hypermesh preempt → site UI → cottage daemon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Fyber Labs / Brewnix" }]
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aimmune = "aimmune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimmune = ["rules/*.yaml", "grants/packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "plane_mocked: optional plane-mocked synthetic (default off; pytest -m plane_mocked)",
    "live_cottage: optional cottage offline-contain smoke (default off; AIMMUNE_LIVE_COTTAGE=1)",
    "plane_staging: optional live plane site-token E2E (default off; PANOPTICON_BASE_URL+HM_SITE_TOKEN+SITE_ID)",
]
addopts = ["-m", "not live_cottage and not plane_staging and not plane_mocked"]
